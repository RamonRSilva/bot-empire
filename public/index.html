<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Controle - Bot Empire HANT1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
    .container { max-width: 800px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
    header { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
    header h1 { font-size: 1.5rem; color: #38bdf8; }
    header p { font-size: 0.9rem; color: #94a3b8; margin-top: 5px; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 15px; }
    .card h2 { font-size: 1.2rem; color: #f1f5f9; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 0.85rem; color: #cbd5e1; font-weight: 600; }
    input, select { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; font-size: 0.9rem; outline: none; }
    input:focus, select:focus { border-color: #38bdf8; }
    .checkbox-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 5px; }
    .checkbox-item { display: flex; align-items: center; gap: 8px; background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #334155; cursor: pointer; }
    .checkbox-item input { width: 16px; height: 16px; cursor: pointer; }
    .checkbox-item span { font-size: 0.85rem; color: #e2e8f0; }
    .btn { background: #0284c7; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 5px; }
    .btn:hover { background: #0369a1; }
    .account-list { display: flex; flex-direction: column; gap: 10px; }
    .account-item { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .account-info { display: flex; flex-direction: column; gap: 4px; }
    .account-name { font-weight: bold; font-size: 0.95rem; }
    .account-details { font-size: 0.8rem; color: #94a3b8; }
    .account-status { font-size: 0.8rem; font-weight: 600; }
    .status-online { color: #4ade80; }
    .status-offline { color: #f87171; }
    .badge { background: #334155; color: #38bdf8; font-size: 0.75rem; padding: 4px 8px; border-radius: 12px; font-weight: bold; }
    .logs-box { background: #090d16; padding: 15px; border-radius: 8px; border: 1px solid #334155; height: 180px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; color: #38bdf8; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Painel Multicontas - Bot Empire (HANT1)</h1>
      <p>Gerenciador de Automações em Nuvem</p>
    </header>

    <div class="card">
      <h2>Conectar & Configurar Conta</h2>
      
      <div class="form-group">
        <label for="accName">Identificador / Nome da Conta</label>
        <input type="text" id="accName" placeholder="Ex: Ramon - HANT1">
      </div>

      <div class="form-group">
        <label for="accUser">Utilizador / E-mail</label>
        <input type="text" id="accUser" placeholder="Seu usuario do jogo">
      </div>

      <div class="form-group">
        <label for="accToken">Senha / SessionKey</label>
        <input type="password" id="accToken" placeholder="Sua senha ou token de acesso">
      </div>

      <div class="form-group">
        <label>Automações Ativas para esta Conta:</label>
        <div class="checkbox-group">
          <label class="checkbox-item">
            <input type="checkbox" id="autoRecrutar" checked>
            <span>Recrutar Tropas</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="autoBaroes" checked>
            <span>Atacar Barões / Torres</span>
          </label>
          <label class="checkbox-item">
            <input type="checkbox" id="autoProducao" checked>
            <span>Produzir Componentes</span>
          </label>
        </div>
      </div>

      <button class="btn" onclick="conectarConta()">Salvar & Iniciar Automação</button>
    </div>

    <div class="card">
      <h2>Contas Ativas (<span id="totalContas">0</span>)</h2>
      <div class="account-list" id="accountList">
        <div style="text-align: center; color: #64748b; font-size: 0.9rem; padding: 10px;">Nenhuma conta conectada no momento.</div>
      </div>
    </div>

    <div class="card">
      <h2>Terminal de Ações & Logs</h2>
      <div class="logs-box" id="logsBox">
        [SISTEMA] Painel carregado com sucesso.<br>
        [SISTEMA] Aguardando configuração de contas no servidor HANT1...
      </div>
    </div>
  </div>

  <script>
    async function conectarConta() {
      const id = document.getElementById('accName').value;
      const usuario = document.getElementById('accUser').value;
      const token = document.getElementById('accToken').value;

      const automacoes = {
        recrutamento: document.getElementById('autoRecrutar').checked,
        baroes: document.getElementById('autoBaroes').checked,
        producao: document.getElementById('autoProducao').checked
      };

      if (!id || !usuario) { alert('Informe o nome identificador e o utilizador da conta!'); return; }

      const logBox = document.getElementById('logsBox');
      logBox.innerHTML += `<br>[CLIENTE] Enviando configuração HANT1 para: ${id}...`;

      try {
        const res = await fetch('/api/conectar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, usuario, token, automacoes })
        });
        const data = await res.json();
        logBox.innerHTML += `<br>[SERVIDOR] ${data.mensagem}`;
        carregarContas();
      } catch (e) {
        logBox.innerHTML += `<br>[ERRO] Falha ao comunicar com o servidor.`;
      }
    }

    async function carregarContas() {
      try {
        const res = await fetch('/api/contas');
        const contas = await res.json();
        
        const list = document.getElementById('accountList');
        document.getElementById('totalContas').innerText = Object.keys(contas).length;

        if (Object.keys(contas).length === 0) {
          list.innerHTML = '<div style="text-align: center; color: #64748b; font-size: 0.9rem; padding: 10px;">Nenhuma conta conectada no momento.</div>';
          return;
        }

        list.innerHTML = '';
        for (let id in contas) {
          const c = contas[id];
          const autos = [];
          if (c.automacoes?.recrutamento) autos.push('Recrutamento');
          if (c.automacoes?.baroes) autos.push('Barões');
          if (c.automacoes?.producao) autos.push('Produção');

          list.innerHTML += `
            <div class="account-item">
              <div class="account-info">
                <span class="account-name">${c.id} (HANT1)</span>
                <span class="account-details">Ativas: ${autos.join(', ') || 'Nenhuma'}</span>
                <span class="account-status ${c.conectado ? 'status-online' : 'status-offline'}">
                  ${c.conectado ? '● Conectada ao HANT1' : '○ Desconectada'}
                </span>
              </div>
              <span class="badge">HANT1</span>
            </div>
          `;
        }
      } catch (e) {}
    }

    setInterval(carregarContas, 5000);
  </script>
</body>
</html>
