<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Painel Bot Empire</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 320px; }
        h2 { text-align: center; color: #ffb703; }
        label { display: block; margin-top: 10px; font-size: 14px; }
        input { width: 100%; padding: 8px; margin-top: 5px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .buttons { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-connect { background: #2b9348; color: white; }
        .btn-connect:hover { background: #55a630; }
        .btn-disconnect { background: #d90429; color: white; }
        .btn-disconnect:hover { background: #ef233c; }
        #status { margin-top: 15px; text-align: center; font-size: 13px; color: #adb5bd; }
    </style>
</head>
<body>

<div class="card">
    <h2>Painel Empire</h2>
    
    <label>Utilizador (Jogador):</label>
    <input type="text" id="usuario" placeholder="Ex: HOKAGE">

    <label>Palavra-passe:</label>
    <input type="password" id="senha" placeholder="Sua senha do jogo">

    <div class="buttons">
        <button class="btn-connect" onclick="conectarBot()">Conectar</button>
        <button class="btn-disconnect" onclick="desconectarBot()">Desconectar</button>
    </div>

    <div id="status"></div>
</div>

<script>
    async function conectarBot() {
        const usuario = document.getElementById('usuario').value.trim();
        const senha = document.getElementById('senha').value.trim();
        const statusDiv = document.getElementById('status');

        if (!usuario || !senha) {
            statusDiv.style.color = '#ef233c';
            statusDiv.innerText = 'Preencha o utilizador e a senha!';
            return;
        }

        statusDiv.style.color = '#ffb703';
        statusDiv.innerText = 'A ligar bot...';

        try {
            const res = await fetch('/api/conectar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario, senha })
            });
            const data = await res.json();
            statusDiv.style.color = '#55a630';
            statusDiv.innerText = data.mensagem || data.erro;
        } catch (e) {
            statusDiv.style.color = '#ef233c';
            statusDiv.innerText = 'Erro ao comunicar com o servidor.';
        }
    }

    async function desconectarBot() {
        const usuario = document.getElementById('usuario').value.trim();
        const statusDiv = document.getElementById('status');

        if (!usuario) {
            statusDiv.style.color = '#ef233c';
            statusDiv.innerText = 'Insira o utilizador para desconectar!';
            return;
        }

        statusDiv.style.color = '#ffb703';
        statusDiv.innerText = 'A desconectar...';

        try {
            const res = await fetch('/api/desconectar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario })
            });
            const data = await res.json();
            statusDiv.style.color = '#55a630';
            statusDiv.innerText = data.mensagem || data.erro;
        } catch (e) {
            statusDiv.style.color = '#ef233c';
            statusDiv.innerText = 'Erro ao desconectar.';
        }
    }
</script>

</body>
</html>
