<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Controle - Bot Empire</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
    .container { max-width: 800px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
    header { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; text-align: center; }
    header h1 { font-size: 1.5rem; color: #38bdf8; }
    header p { font-size: 0.9rem; color: #94a3b8; margin-top: 5px; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 15px; }
    .card h2 { font-size: 1.2rem; color: #f1f5f9; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 0.85rem; color: #cbd5e1; }
    input, select { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; font-size: 0.9rem; outline: none; }
    input:focus, select:focus { border-color: #38bdf8; }
    .btn { background: #0284c7; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #0369a1; }
    .account-list { display: flex; flex-direction: column; gap: 10px; }
    .account-item { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .account-info { display: flex; flex-direction: column; gap: 2px; }
    .account-name { font-weight: bold; font-size: 0.95rem; }
    .account-status { font-size: 0.8rem; }
    .status-online { color: #4ade80; }
    .status-offline { color: #f87171; }
    .badge { background: #334155; color: #94a3b8; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; display: inline-block; width: fit-content; }
    .logs-box { background: #090d16; padding: 15px; border-radius: 8px; border: 1px solid #334155; height: 180px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; color: #38bdf8; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Painel Multicontas - Empire Bot</h1>
      <p>Gerenciador de Automações em Nuvem</p>
    </header>

    <div class="card">
      <h2>Conectar Nova Conta</h2>
      <div class="form-group">
        <label for="accName">Identificador da Conta (Ex: Conta Princ, Alt 1)</label>
        <input type="text" id="accName" placeholder="Ex: Ramon - Principal">
      </div>
      <div class="form-group">
        <label for="accToken">Token / Dados de Acesso (JSON ou Key)</label>
        <input type="text" id="accToken" placeholder="Insira o payload de login">
      </div>
      <button class="btn" onclick="conectarConta()">Conectar Conta ao Jogo</button>
    </div>

    <div class="card">
      <h2>Contas Ativas (<span id="totalContas">0</span>)</h2>
      <div class="account-list" id="accountList">
        <div style="text-align: center; color: #64748b; font-size: 0.9rem; padding: 10px;">Nenhuma conta conectada no momento.</div>
      </div>
    </div>

    <div class="card">
      <h2>Terminal de Ações & Logs</h2>
      <div class="logs-box" id="logsBox">
        [SISTEMA] Painel carregado com sucesso.<br>
        [SISTEMA] Aguardando conexão de contas...
      </div>
    </div>
  </div>

  <script>
    async function conectarConta() {
      const name = document.getElementById('accName').value;
      const token = document.getElementById('accToken').value;

      if (!name) { alert('Informe o nome da conta!'); return; }

      const logBox = document.getElementById('logsBox');
      logBox.innerHTML += `<br>[CLIENTE] Enviando requisição para conectar: ${name}...`;

      try {
        const res = await fetch('/api/conectar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: name, token: token })
        });
        const data = await res.json();
        logBox.innerHTML += `<br>[SERVIDOR] ${data.mensagem}`;
        carregarContas();
      } catch (e) {
        logBox.innerHTML += `<br>[ERRO] Falha ao comunicar com o servidor.`;
      }
    }

    async function carregarContas() {
      try {
        const res = await fetch('/api/contas');
        const contas = await res.json();
        
        const list = document.getElementById('accountList');
        document.getElementById('totalContas').innerText = Object.keys(contas).length;

        if (Object.keys(contas).length === 0) {
          list.innerHTML = '<div style="text-align: center; color: #64748b; font-size: 0.9rem; padding: 10px;">Nenhuma conta conectada no momento.</div>';
          return;
        }

        list.innerHTML = '';
        for (let id in contas) {
          const c = contas[id];
          list.innerHTML += `
            <div class="account-item">
              <div class="account-info">
                <span class="account-name">${id}</span>
                <span class="account-status ${c.conectado ? 'status-online' : 'status-offline'}">
                  ${c.conectado ? '● Conectada ao WebSocket' : '○ Desconectada'}
                </span>
              </div>
              <span class="badge">Ativa</span>
            </div>
          `;
        }
      } catch (e) {}
    }

    setInterval(carregarContas, 5000);
  </script>
</body>
</html>
